name: Backup Temp Lifecycle Gate

on:
  pull_request:
    branches: [19.0]
    paths:
      - 'auto_database_backup/models/db_backup_temp_lifecycle.py'
      - 'auto_database_backup/models/__init__.py'
      - '.github/workflows/backup-temp-lifecycle-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            auto_database_backup/models/db_backup_temp_lifecycle.py
            auto_database_backup/models/__init__.py
            .github/workflows/backup-temp-lifecycle-gate.yml
          sparse-checkout-cone-mode: false

      - name: Compile hardening module
        run: python -m py_compile auto_database_backup/models/db_backup_temp_lifecycle.py

      - name: Guard namespace ownership
        shell: bash
        run: |
          set -euo pipefail
          file='auto_database_backup/models/db_backup_temp_lifecycle.py'
          grep -q '_OWNED_TMP_DIRNAME = "odoo-auto-database-backup"' "$file"
          grep -q 'getattr(os, "geteuid"' "$file"
          grep -q 'entry.name.startswith("backup-")' "$file"
          if grep -Eq "rmtree\(|os\.listdir\(tempfile\.gettempdir\(\)\)|startswith\(['\"]tmp['\"]\)" "$file"; then
            echo 'Unsafe generic temp sweep detected'
            exit 1
          fi

      - name: Guard active-upload and deterministic cleanup
        shell: bash
        run: |
          set -euo pipefail
          file='auto_database_backup/models/db_backup_temp_lifecycle.py'
          grep -q 'delete=False' "$file"
          grep -q 'lock_path = temp.name + ".lock"' "$file"
          grep -q 'LOCK_EX | fcntl.LOCK_NB' "$file"
          grep -q '^        finally:' "$file"
          grep -q 'for path in (temp.name, lock_path):' "$file"
          grep -q 'os.remove(path)' "$file"
