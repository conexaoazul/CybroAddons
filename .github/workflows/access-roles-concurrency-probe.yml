name: Access Roles Concurrency Probe

on:
  pull_request:
    paths:
      - 'access_roles/**'
      - 'scripts/access_roles_concurrency_probe.py'
      - '.github/workflows/access-roles-concurrency-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile probe
        run: python -m py_compile scripts/access_roles_concurrency_probe.py
      - name: Detect registry rebuild hazard
        run: python scripts/access_roles_concurrency_probe.py | tee access-roles-concurrency.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: access-roles-concurrency-probe
          path: access-roles-concurrency.json
          retention-days: 30
